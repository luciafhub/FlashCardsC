<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>My Personal Vocabulary</title>

<style>
  body {
    font-family: Arial;
    background: #f0f0f0;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1, h2 { text-align: center; }

  input, textarea {
    padding: 10px;
    margin: 6px;
    width: 280px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  textarea {
    height: 70px;
  }

  button {
    padding: 9px 16px;
    border: none;
    background: #2196F3;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
  }

  .btn-toggle { background: #ff9800; }
  .btn-export { background: #4CAF50; }
  .btn-back { background: #555; }

  .section {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin: 15px;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    text-align: center;
  }

  .card {
    width: 280px;
    min-height: 170px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    padding: 20px;
    margin: 20px auto;
    cursor: pointer;
  }

  #answer {
    display: none;
    margin-top: 12px;
    font-weight: bold;
  }

  #example {
    display: none;
    font-size: 14px;
    margin-top: 10px;
    opacity: 0.7;
  }

  .hidden {
    display: none;
  }
</style>
</head>

<body>

<h1>📚 My Personal Vocabulary</h1>

<div id="menu" class="section">
  <h2>¿Qué quieres hacer?</h2>
  <button onclick="showAddPanel()">Añadir vocabulario</button>
  <button onclick="showStudyPanel()">Estudiar flashcards</button>
  <br>
  <button class="btn-export" onclick="exportVocab()">Exportar vocabulario</button>
</div>

<div id="addPanel" class="section hidden">
  <h2>Añadir palabra</h2>

  <input id="enInput" placeholder="Palabra o expresión en inglés">
  <input id="esInput" placeholder="Traducción en español">
  <textarea id="exampleInput" placeholder="Frase ejemplo (opcional)"></textarea>

  <br>

  <button onclick="addWord()">Guardar</button>
  <button class="btn-back" onclick="showMenu()">Volver</button>
</div>

<div id="studyPanel" class="section hidden">
  <h2>Flashcard</h2>

  <p id="counter"></p>

  <div class="card" onclick="flipCard()">
    <div id="question">Añade una palabra para empezar</div>
    <div id="answer"></div>
    <div id="example"></div>
  </div>

  <button onclick="prevCard()">Anterior</button>
  <button class="btn-toggle" onclick="toggleDirection()">EN↔ES</button>
  <button onclick="nextCard()">Siguiente</button>
  <br>
  <button class="btn-back" onclick="showMenu()">Volver</button>
</div>

<script>
let vocab = JSON.parse(localStorage.getItem("personal_vocab") || "[]");

let index = 0;
let reversed = false;
let flipped = false;

function saveVocab() {
  localStorage.setItem("personal_vocab", JSON.stringify(vocab));
}

function hideAll() {
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("addPanel").classList.add("hidden");
  document.getElementById("studyPanel").classList.add("hidden");
}

function showMenu() {
  hideAll();
  document.getElementById("menu").classList.remove("hidden");
}

function showAddPanel() {
  hideAll();
  document.getElementById("addPanel").classList.remove("hidden");
}

function showStudyPanel() {
  hideAll();
  document.getElementById("studyPanel").classList.remove("hidden");
  showCard();
}

function addWord() {
  const en = document.getElementById("enInput").value.trim();
  const es = document.getElementById("esInput").value.trim();
  const example = document.getElementById("exampleInput").value.trim();

  if (!en || !es) {
    alert("Escribe la palabra en inglés y su traducción.");
    return;
  }

  vocab.push({ en, es, example });
  saveVocab();

  document.getElementById("enInput").value = "";
  document.getElementById("esInput").value = "";
  document.getElementById("exampleInput").value = "";

  alert("Palabra guardada.");
}

function showCard() {
  const answerBox = document.getElementById("answer");
  const exampleBox = document.getElementById("example");

  if (vocab.length === 0) {
    document.getElementById("question").textContent = "Añade una palabra para empezar";
    answerBox.textContent = "";
    exampleBox.textContent = "";
    document.getElementById("counter").textContent = "0 palabras";
    return;
  }

  const c = vocab[index];

  document.getElementById("question").textContent = reversed ? c.es : c.en;
  answerBox.textContent = reversed ? c.en : c.es;
  exampleBox.textContent = c.example || "";

  answerBox.style.display = flipped ? "block" : "none";
  exampleBox.style.display = flipped && c.example ? "block" : "none";

  document.getElementById("counter").textContent =
    `Palabra ${index + 1} de ${vocab.length}`;
}

function flipCard() {
  flipped = !flipped;
  showCard();
}

function nextCard() {
  if (vocab.length === 0) return;
  index = Math.floor(Math.random() * vocab.length);
  flipped = false;
  showCard();
}

function prevCard() {
  if (vocab.length === 0) return;
  index = (index - 1 + vocab.length) % vocab.length;
  flipped = false;
  showCard();
}

function toggleDirection() {
  reversed = !reversed;
  flipped = false;
  showCard();
}

function exportVocab() {
  if (vocab.length === 0) {
    alert("No tienes vocabulario para exportar.");
    return;
  }

  const data = JSON.stringify(vocab, null, 2);
  const blob = new Blob([data], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "mi_vocabulario_personal.json";
  a.click();

  URL.revokeObjectURL(url);
}

showMenu();
</script>

</body>
</html>
