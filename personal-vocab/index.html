```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>My Personal Vocabulary</title>

<style>
  body {
    font-family: Arial;
    background: #f0f0f0;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    text-align: center;
  }

  input, textarea {
    padding: 10px;
    margin: 6px;
    width: 280px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
  }

  textarea {
    height: 70px;
    resize: vertical;
  }

  button {
    padding: 8px 16px;
    border: none;
    background: #2196F3;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    margin: 5px;
    font-size: 14px;
  }

  .btn-delete {
    background: #e53935;
  }

  .btn-toggle {
    background: #ff9800;
  }

  .btn-export {
    background: #4CAF50;
  }

  .card {
    width: 300px;
    min-height: 180px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    padding: 20px;
    margin: 20px;
    cursor: pointer;
  }

  #answer {
    display: none;
    margin-top: 12px;
    opacity: 0.9;
    font-weight: bold;
  }

  #example {
    display: none;
    font-size: 14px;
    margin-top: 10px;
    opacity: 0.7;
  }

  .section {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin: 15px;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  }

  .word-item {
    border-bottom: 1px solid #ddd;
    padding: 10px 0;
  }

  .counter {
    opacity: 0.7;
    font-size: 14px;
  }
</style>
</head>

<body>

<h1>📚 My Personal Vocabulary</h1>

<div class="section">

  <h2>Añadir palabra</h2>

  <input id="enInput" placeholder="Palabra o expresión en inglés">

  <input id="esInput" placeholder="Traducción en español">

  <textarea id="exampleInput" placeholder="Frase ejemplo (opcional)"></textarea>

  <br>

  <button onclick="addWord()">Añadir</button>

  <button class="btn-export" onclick="exportVocab()">
    Exportar vocabulario
  </button>

</div>

<div class="section">

  <h2>Flashcard</h2>

  <p id="counter" class="counter"></p>

  <div class="card" onclick="flipCard()">

    <div id="question">
      Añade una palabra para empezar
    </div>

    <div id="answer"></div>

    <div id="example"></div>

  </div>

  <button onclick="prevCard()">Anterior</button>

  <button class="btn-toggle" onclick="toggleDirection()">
    EN↔ES
  </button>

  <button onclick="nextCard()">Siguiente</button>

</div>

<div class="section">

  <h2>Mis palabras</h2>

  <div id="wordList"></div>

</div>

<script>

let vocab = JSON.parse(localStorage.getItem("personal_vocab") || "[]");

let index = 0;
let reversed = false;
let flipped = false;

function saveVocab() {
  localStorage.setItem("personal_vocab", JSON.stringify(vocab));
}

function addWord() {

  const en = document.getElementById("enInput").value.trim();
  const es = document.getElementById("esInput").value.trim();
  const example = document.getElementById("exampleInput").value.trim();

  if (!en || !es) {
    alert("Escribe la palabra en inglés y su traducción.");
    return;
  }

  vocab.push({
    en: en,
    es: es,
    example: example
  });

  saveVocab();

  document.getElementById("enInput").value = "";
  document.getElementById("esInput").value = "";
  document.getElementById("exampleInput").value = "";

  index = vocab.length - 1;

  flipped = false;

  showCard();
  renderList();
}

function showCard() {

  const answerBox = document.getElementById("answer");
  const exampleBox = document.getElementById("example");

  if (vocab.length === 0) {

    document.getElementById("question").textContent =
      "Añade una palabra para empezar";

    answerBox.textContent = "";
    exampleBox.textContent = "";

    document.getElementById("counter").textContent =
      "0 palabras";

    return;
  }

  const c = vocab[index];

  document.getElementById("question").textContent =
    reversed ? c.es : c.en;

  answerBox.textContent =
    reversed ? c.en : c.es;

  exampleBox.textContent =
    c.example || "";

  answerBox.style.display =
    flipped ? "block" : "none";

  exampleBox.style.display =
    flipped && c.example ? "block" : "none";

  document.getElementById("counter").textContent =
    `Palabra ${index + 1} de ${vocab.length}`;
}

function flipCard() {

  flipped = !flipped;

  showCard();
}

function nextCard() {

  if (vocab.length === 0) return;

  index = Math.floor(Math.random() * vocab.length);

  flipped = false;

  showCard();
}

function prevCard() {

  if (vocab.length === 0) return;

  index = (index - 1 + vocab.length) % vocab.length;

  flipped = false;

  showCard();
}

function toggleDirection() {

  reversed = !reversed;

  flipped = false;

  showCard();
}

function deleteWord(i) {

  vocab.splice(i, 1);

  saveVocab();

  if (index >= vocab.length) {
    index = Math.max(0, vocab.length - 1);
  }

  flipped = false;

  showCard();

  renderList();
}

function renderList() {

  const box = document.getElementById("wordList");

  box.innerHTML = "";

  if (vocab.length === 0) {

    box.innerHTML =
      "<p>No tienes palabras guardadas todavía.</p>";

    return;
  }

  vocab.forEach((word, i) => {

    box.innerHTML += `
      <div class="word-item">

        <strong>${word.en}</strong><br>

        ${word.es}<br>

        ${word.example ? `<em>${word.example}</em><br>` : ""}

        <button class="btn-delete"
                onclick="deleteWord(${i})">

          Eliminar

        </button>

      </div>
    `;
  });
}

function exportVocab() {

  if (vocab.length === 0) {

    alert("No tienes vocabulario para exportar.");

    return;
  }

  const data =
    JSON.stringify(vocab, null, 2);

  const blob =
    new Blob([data], { type: "application/json" });

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "mi_vocabulario_personal.json";

  a.click();

  URL.revokeObjectURL(url);
}

showCard();

renderList();

</script>

</body>
</html>
```
